# Configuration for testing PPI optimizer with modular algorithms
algorithm: gradient_mcmc  # gradient_mcmc, sweep, cascade
algorithm_config:
  mutate_each: 1
  random_mut: false
  opt_steps:
    total_steps: 200
    T_init: 1.0
    half_life: 40
  save_accept: false

# Model and checkpoint
checkpoint_path: /path/to/modelhub_af3_with_confidence_ep804.ckpt
n_recycles: 10
diffusion_batch_size: 1


lr: 0.01
max_mut: 5
# for cascade only
n_cycles: 1
enable_semigreedy: true

# PPI-specific optimization targets
optimize_binder: true
interface_only: false

# Template options
self_template: false

# Loss configuration for PPI optimization
loss:
  weights:
    ContactLoss_inter: 1.0
    ContactLoss_intra: 1.0

loss_config:
  ContactLoss:
    - _name: inter_contact
      contact_type: inter
      cutoff: 22.0
      k: 1
      weight_by_name: ContactLoss_inter
    - _name: intra_contact
      contact_type: intra
      cutoff: 14.0
      k: 2
      min_seq_sep: 9
      weight_by_name: ContactLoss_intra